# Checks for every pull request and every push to main: backend tests (Python) and
# UI analysis/tests (Flutter). The UI integration test (test/visual_test.dart) starts
# the real backend, so the Flutter job installs Python and its dependencies too.
name: CI

on:
  push:
    branches: [main]           # feature branches are checked in their pull request
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  flutter:
    name: UI (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_flutter
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r ../requirements-dev.txt
      - name: Fonts for the UI test (metric-compatible with Arial / Consolas)
        run: sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
