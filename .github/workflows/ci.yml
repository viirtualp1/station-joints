# Проверки на каждый push и pull request: тесты бэкенда (Python) и интерфейса (Flutter).
# Интеграционный тест интерфейса (test/visual_test.dart) запускает настоящий бэкенд,
# поэтому в job Flutter тоже ставится Python с зависимостями.
name: CI

on:
  push:
    branches: [main]           # ветки с правками проверяются в pull request – без двойных прогонов
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Бэкенд (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  flutter:
    name: Интерфейс (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r ../requirements-dev.txt
      - run: sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
