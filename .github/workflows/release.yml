# Automatic release. To ship a new version, bump `version:` in app_flutter/pubspec.yaml
# and push to main. If tag vX.Y.Z does not exist yet, this workflow builds the Windows
# installer (python build.py), creates the tag and publishes a GitHub Release with
#   StationJoints-Setup-X.Y.Z.exe and StationJoints-win64.zip
# Installed apps pick it up themselves (update.dart reads releases/latest).
# Pushes that do not change the version build nothing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:           # manual run: same check, e.g. to retry a failed release

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write              # create the tag and the release

jobs:
  version:
    name: New version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          v=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' app_flutter/pubspec.yaml)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            echo "v$v is already released – nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$v is new – building a release"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and publish (Windows)
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'          # build messages are Russian; the runner console is cp1252
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Smoke test before building
        run: |
          pip install opencv-python-headless numpy pillow
          python tools/smoke_test.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build (build.py)
        run: python build.py

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/StationJoints-Setup-*.exe
            dist/StationJoints-win64.zip
