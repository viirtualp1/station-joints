name: station_joints
description: "Схема станции: стыки, светофоры и маршруты по методичке"
publish_to: 'none'

# Одна версия на всё: интерфейс, установщик (build.py), тег выпуска vX.Y.Z (release.yml)
# и проверка обновлений в программе. Поднимать перед каждым выпуском.
version: 2.2.1+9

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  win32: ^6.4.0
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/icon.png
  uses-material-design: true
